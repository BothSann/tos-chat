name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same image and host port as the local postgres-test service (docker-compose.yml).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tos
          POSTGRES_PASSWORD: tos
          POSTGRES_DB: tos_chat_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tos -d tos_chat_test"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tos:tos@127.0.0.1:5433/tos_chat_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.9

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests (api)
        run: pnpm --filter api test

      - name: E2E tests (api)
        run: pnpm --filter api test:e2e

      - name: Build
        run: pnpm build
