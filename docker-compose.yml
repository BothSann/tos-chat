services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: tos
            POSTGRES_PASSWORD: tos
            POSTGRES_DB: tos_chat
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tos -d tos_chat"]
            interval: 5s
            retries: 10

    # Disposable database for e2e tests; tmpfs wipes it on every restart.
    postgres-test:
        image: postgres:17
        environment:
            POSTGRES_USER: tos
            POSTGRES_PASSWORD: tos
            POSTGRES_DB: tos_chat_test
        ports:
            - "5433:5432"
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tos -d tos_chat_test"]
            interval: 5s
            retries: 10

volumes:
    pgdata:
